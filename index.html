<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayi Subah Foundation | Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- FIREBASE SDKs (v10 Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            sendSignInLinkToEmail, 
            isSignInWithEmailLink, 
            signInWithEmailLink,
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ⚠️ Replace these values with your actual Firebase Project keys from firebase.google.com
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "nayi-subah-foundation.firebaseapp.com",
            projectId: "nayi-subah-foundation",
            storageBucket: "nayi-subah-foundation.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // 1. Check Auth State on Page Load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in! Hide auth screen, show main portal content
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('portalContent').classList.remove('hidden');
                document.getElementById('userDisplayName').innerText = user.displayName || user.email;
            } else {
                // User is signed out! Force overlay display
                document.getElementById('authOverlay').classList.remove('hidden');
                document.getElementById('portalContent').classList.add('hidden');
            }
        });

        // 2. Google OAuth Provider Flow
        window.handleGoogleLogin = async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                Swal.fire({ icon: 'success', title: 'Welcome!', text: 'Successfully authenticated with Google.', timer: 1500, showConfirmButton: false });
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Authentication Failed', text: error.message });
            }
        };

        // 3. Email OTP / Magic Link Verification Flow
        window.handleEmailOTP = async () => {
            const email = document.getElementById('userEmailInput').value.trim();
            if(!email) {
                Swal.fire({ icon: 'warning', title: 'Email Required', text: 'Please enter a valid Gmail or Email address!' });
                return;
            }

            const actionCodeSettings = {
                url: window.location.href, // Redirect back to this exact page after clicking link
                handleCodeInApp: true,
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                window.localStorage.setItem('emailForSignIn', email);
                Swal.fire({ 
                    icon: 'info', 
                    title: 'Verification Link Sent!', 
                    text: `We sent a secure sign-in verification link to ${email}. Please check your Gmail inbox and click the link to complete login.` 
                });
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'OTP Error', text: error.message });
            }
        };

        // 4. Complete Email Sign-In when clicking email link
        if (isSignInWithEmailLink(auth, window.location.href)) {
            let email = window.localStorage.getItem('emailForSignIn');
            if (!email) {
                email = window.prompt('Please enter your email for verification confirmation:');
            }
            signInWithEmailLink(auth, email, window.location.href)
                .then(() => {
                    window.localStorage.removeItem('emailForSignIn');
                    Swal.fire({ icon: 'success', title: 'Verified!', text: 'Your email has been authenticated successfully.' });
                })
                .catch((error) => {
                    Swal.fire({ icon: 'error', title: 'Link Expired/Invalid', text: error.message });
                });
        }

        // 5. Logout Execution
        window.handleLogout = async () => {
            await signOut(auth);
            Swal.fire({ icon: 'success', title: 'Logged Out', text: 'You have been signed out securely.', timer: 1200, showConfirmButton: false });
        };
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- LOGIN & SIGN-UP MANDATORY GATEWAY OVERLAY -->
    <div id="authOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 text-center">
            
            <div class="space-y-2">
                <div class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 w-12 h-12 rounded-2xl mx-auto flex items-center justify-center text-xl font-bold">
                    🏛️
                </div>
                <h1 class="text-2xl font-black text-white">Nayi Subah Foundation</h1>
                <p class="text-xs text-slate-400">Please authenticate your identity to access the portal.</p>
            </div>

            <div class="space-y-4">
                <!-- OPTION A: ONE-CLICK GOOGLE LOGIN -->
                <button onclick="handleGoogleLogin()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 transition cursor-pointer shadow-lg">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Continue with Google
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">OR VIA EMAIL OTP</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <!-- OPTION B: EMAIL OTP / VERIFICATION LINK -->
                <div class="space-y-2">
                    <input type="email" id="userEmailInput" placeholder="Enter your Gmail address..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <button onclick="handleEmailOTP()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3.5 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">
                        📩 Send Email OTP Link
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- MAIN SECURE PORTAL CONTENT (Hidden until authenticated) -->
    <div id="portalContent" class="hidden min-h-screen flex flex-col justify-between">
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <div class="font-extrabold text-emerald-400 tracking-wide">NAYI SUBAH FOUNDATION</div>
            <div class="flex items-center gap-4">
                <span id="userDisplayName" class="text-xs font-bold text-slate-300"></span>
                <button onclick="handleLogout()" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                    Logout
                </button>
            </div>
        </header>

        <main class="max-w-4xl mx-auto py-12 px-4 text-center space-y-4">
            <h2 class="text-3xl font-black text-white">Welcome to the Portal</h2>
            <p class="text-slate-400 text-sm">You have successfully authenticated into the Nayi Subah Foundation database area.</p>
        </main>

        <footer class="bg-slate-950 text-center py-4 text-xs text-slate-600">
            © Nayi Subah Foundation • Secure Portal
        </footer>
    </div>

</body>
</html>
